server {
  listen 80;
  root /usr/share/nginx/html;
  location /api/v1/assistant/ { proxy_pass http://jtt-ai:8001/api/assistant/; }
  location /api/v1/learning/assistant/ { proxy_pass http://jtt-ai:8001/api/learning/assistant/; }
  location /api/ { proxy_pass http://jtt-backend:8002/api/; }
  location / { try_files $uri $uri/ /index.html; }
}

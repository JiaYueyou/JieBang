services:
  mysql:
    ports:
      - "127.0.0.1:${MYSQL_FORWARD_PORT:-23306}:3306"

  neo4j:
    ports:
      - "127.0.0.1:${NEO4J_HTTP_FORWARD_PORT:-17474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_FORWARD_PORT:-17687}:7687"

  redis:
    ports:
      - "127.0.0.1:${REDIS_FORWARD_PORT:-16379}:6379"

  redis-cache:
    ports:
      - "127.0.0.1:${REDIS_CACHE_FORWARD_PORT:-16380}:6379"

  fyz-api:
    ports:
      - "127.0.0.1:${API_FORWARD_PORT:-18000}:8000"

name: jiebang-fyz

x-fyz-environment: &fyz-environment
  TESTING: "false"
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_USER: ${MYSQL_USER:-jiebang}
  DB_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
  DB_NAME: ${MYSQL_DATABASE:-jie_bang}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
  JWT_ALGORITHM: HS256
  JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-120}
  INITIAL_ADMIN_ENABLED: "true"
  INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-admin}
  INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:?INITIAL_ADMIN_PASSWORD is required}
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_USER: neo4j
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}
  CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/1
  CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/2
  CELERY_TASK_ALWAYS_EAGER: "false"
  REDIS_CACHE_URL: redis://:${REDIS_CACHE_PASSWORD:?REDIS_CACHE_PASSWORD is required}@redis-cache:6379/0
  CACHE_ENABLED: ${CACHE_ENABLED:-true}
  CACHE_KEY_PREFIX: ${CACHE_KEY_PREFIX:-jiebang:fyz:v1}
  CACHE_DEFAULT_TTL_SECONDS: ${CACHE_DEFAULT_TTL_SECONDS:-120}
  CACHE_TASK_ACTIVE_TTL_SECONDS: ${CACHE_TASK_ACTIVE_TTL_SECONDS:-15}
  CACHE_TASK_TERMINAL_TTL_SECONDS: ${CACHE_TASK_TERMINAL_TTL_SECONDS:-86400}
  CACHE_CONNECT_TIMEOUT_SECONDS: ${CACHE_CONNECT_TIMEOUT_SECONDS:-0.5}
  CACHE_SOCKET_TIMEOUT_SECONDS: ${CACHE_SOCKET_TIMEOUT_SECONDS:-1.0}
  CACHE_WARM_INTERVAL_SECONDS: ${CACHE_WARM_INTERVAL_SECONDS:-60}
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
  DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
  DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
  DEEPSEEK_TIMEOUT_SECONDS: ${DEEPSEEK_TIMEOUT_SECONDS:-60}
  DEEPSEEK_CONNECT_TIMEOUT_SECONDS: ${DEEPSEEK_CONNECT_TIMEOUT_SECONDS:-10}
  DEEPSEEK_MAX_ATTEMPTS: ${DEEPSEEK_MAX_ATTEMPTS:-2}
  RETRIEVAL_EMBEDDING_PROVIDER: ${RETRIEVAL_EMBEDDING_PROVIDER:-local_hash}
  RETRIEVAL_VECTOR_BACKEND: ${RETRIEVAL_VECTOR_BACKEND:-local_hash}
  OPENAI_EMBEDDING_API_KEY: ${OPENAI_EMBEDDING_API_KEY:-}
  OPENAI_EMBEDDING_BASE_URL: ${OPENAI_EMBEDDING_BASE_URL:-https://api.openai-proxy.org/v1}
  OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-large}
  OPENAI_EMBEDDING_DIMENSIONS: ${OPENAI_EMBEDDING_DIMENSIONS:-3072}
  CHROMA_MODE: persistent
  CHROMA_PERSIST_PATH: /app/storage/chroma
  DATA_DIR: /app/data
  LOCAL_STORAGE_PATH: /app/storage
  JIEBANG_AGENT_PATH: /app/agent-development/src
  AUTO_PIPELINE_ENABLED: ${AUTO_PIPELINE_ENABLED:-false}
  RECOVER_PENDING_TASKS_ON_STARTUP: ${RECOVER_PENDING_TASKS_ON_STARTUP:-false}
  AUTO_PIPELINE_INTERVAL_MINUTES: ${AUTO_PIPELINE_INTERVAL_MINUTES:-1440}
  AUTO_PIPELINE_STARTUP_DELAY_SECONDS: ${AUTO_PIPELINE_STARTUP_DELAY_SECONDS:-60}
  AUTO_PIPELINE_SOURCE_IDS: ${AUTO_PIPELINE_SOURCE_IDS:-4,5,6}
  FYZ_SNAPSHOT_BOOTSTRAP_MODE: ${FYZ_SNAPSHOT_BOOTSTRAP_MODE:-if-empty}
  TZ: Asia/Shanghai

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-jie_bang}
      MYSQL_USER: ${MYSQL_USER:-jiebang}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - backend

  neo4j:
    image: neo4j:5-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}
      JIEBANG_NEO4J_PASSWORD: ${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}
      NEO4J_server_default__listen__address: 0.0.0.0
      TZ: Asia/Shanghai
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -a bolt://127.0.0.1:7687 -u neo4j -p \"$${JIEBANG_NEO4J_PASSWORD}\" 'RETURN 1;' >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 40s
    networks:
      - backend

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      TZ: Asia/Shanghai
    command:
      - sh
      - -c
      - exec redis-server /usr/local/etc/redis/redis.conf --requirepass "$${REDIS_PASSWORD}"
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - backend

  redis-cache:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDIS_CACHE_PASSWORD: ${REDIS_CACHE_PASSWORD:?REDIS_CACHE_PASSWORD is required}
      TZ: Asia/Shanghai
    command:
      - sh
      - -c
      - exec redis-server /usr/local/etc/redis/cache.conf --requirepass "$${REDIS_CACHE_PASSWORD}"
    volumes:
      - ./redis/cache.conf:/usr/local/etc/redis/cache.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${REDIS_CACHE_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - backend

  fyz-migrate:
    image: jiebang-fyz-backend:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile.fyz
    restart: "no"
    environment: *fyz-environment
    command: ["alembic", "upgrade", "head"]
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - backend

  fyz-bootstrap-snapshot:
    image: jiebang-fyz-backend:local
    restart: "no"
    environment: *fyz-environment
    command: ["python", "scripts/bootstrap_competition_snapshot.py"]
    volumes:
      - fyz-storage:/app/storage
    depends_on:
      fyz-migrate:
        condition: service_completed_successfully
      neo4j:
        condition: service_healthy
    networks:
      - backend

  fyz-api:
    image: jiebang-fyz-backend:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile.fyz
    restart: unless-stopped
    init: true
    environment: *fyz-environment
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "1"
      - --proxy-headers
      - --forwarded-allow-ips=*
    volumes:
      - ${FYZ_DATA_HOST_PATH:-../data}:/app/data
      - fyz-storage:/app/storage
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      fyz-bootstrap-snapshot:
        condition: service_completed_successfully
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_grace_period: 30s
    networks:
      - backend

  celery-worker:
    image: jiebang-fyz-backend:local
    restart: unless-stopped
    init: true
    environment: *fyz-environment
    command:
      - celery
      - -A
      - app.core.celery_app.celery_app
      - worker
      - --loglevel=INFO
      - --pool=solo
      - --queues=celery
      - --hostname=fyz-worker@%h
    volumes:
      - ${FYZ_DATA_HOST_PATH:-../data}:/app/data
      - fyz-storage:/app/storage
    depends_on:
      fyz-bootstrap-snapshot:
        condition: service_completed_successfully
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_grace_period: 60s
    networks:
      - backend

  celery-beat:
    image: jiebang-fyz-backend:local
    restart: unless-stopped
    init: true
    environment: *fyz-environment
    command:
      - celery
      - -A
      - app.core.celery_app.celery_app
      - beat
      - --loglevel=INFO
      - --schedule=/tmp/celerybeat-schedule
    depends_on:
      fyz-bootstrap-snapshot:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    stop_grace_period: 30s
    networks:
      - backend

  celery-cache-worker:
    image: jiebang-fyz-backend:local
    restart: unless-stopped
    init: true
    environment: *fyz-environment
    command:
      - celery
      - -A
      - app.core.celery_app.celery_app
      - worker
      - --loglevel=INFO
      - --pool=solo
      - --queues=cache_warmup
      - --hostname=fyz-cache-worker@%h
    depends_on:
      fyz-bootstrap-snapshot:
        condition: service_completed_successfully
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_grace_period: 30s
    networks:
      - backend

  nginx:
    image: jiebang-fyz-web:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile.nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-18080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    depends_on:
      fyz-api:
        condition: service_healthy
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  mysql-data:
  neo4j-data:
  neo4j-logs:
  redis-data:
  fyz-storage:

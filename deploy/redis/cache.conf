bind 0.0.0.0
protected-mode yes
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# Query and task-state cache. This instance is deliberately separated from
# the Celery broker so cache eviction can never discard queued jobs.
save ""
appendonly no
maxmemory 256mb
maxmemory-policy volatile-lru
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes

loglevel notice
databases 4

# 字节跳动官网 — 爬虫配置
# 数据源：jobs.bytedance.com (社会化招聘 / experienced)
# 对应爬虫：spiders/bytedance_spider.py
#
# 说明：
#   1. 该接口有反爬机制（_signature 签名 + CSRF token），爬虫先用
#      Playwright 打开页面引导获取合法会话，再用 requests 快速分页。
#   2. 字节跳动不公开薪资/学历/经验；学历/经验从 JD 文本中正则提取，
#      提取不到则为"不限"。薪资输出为 None。
#   3. 接口无发布时间过滤（start_time 参数无效），且单次搜索最多
#      返回 10000 条。因此爬虫采用"并集"策略：未过滤搜索抓取前 10000
#      条（新岗位排名靠前，实测完整覆盖近三个月岗位）+ 按 66 个叶子
#      类别分区补充抓取，全量去重后在客户端按发布时间的月份过滤。

# ========== 基础信息 ==========
name: "bytedance"
source_name: "字节跳动招聘"
base_url: "https://jobs.bytedance.com/api/v1/search/job/posts"

# ========== 请求配置 ==========
method: POST
request_interval: 1.0        # 每秒最多1次请求
retry_times: 3                # 失败重试3次
retry_delay: 2                # 重试间隔2秒
timeout: 30

# ========== 分页 ==========
# 注意：字节接口用 offset（偏移量）分页，每页 limit 条
# 未过滤搜索最多返回 10000 条，limit=1000 时约 10 个分块
page_start: 1                 # 起始页码（从1开始）
total_pages: 10               # 未过滤搜索分块数（约 ceil(10000/page_size)）
page_size: 1000               # 每块条数（接口支持最大1000）

# ========== 过滤条件 ==========
filters:
  months_back: 3              # 客户端按发布时间过滤近3个月

# ========== 引导页面（Playwright 获取签名）==========
bootstrap_url: "https://jobs.bytedance.com/experienced/position"

# ========== 请求体模板（POST body）==========
request_body_template:
  keyword: ""
  job_category_id_list: []
  tag_id_list: []
  location_code_list: []
  subject_id_list: []
  recruitment_id_list: []
  portal_type: 2
  job_function_id_list: []
  storefront_id_list: []
  portal_entrance: 1

# ========== 解析规则（API 字段 -> 标准字段）==========
parse_rules:
  title: "title"
  description: "description"      # 工作职责
  requirement: "requirement"      # 任职要求
  city: "city_info.name"
  publish_time: "publish_time"    # 毫秒时间戳
  job_id: "id"

# ========== 额外请求头（固定部分，会话相关由引导时注入）==========
headers:
  Accept: "application/json, text/plain, */*"
  Content-Type: "application/json"
  Referer: "https://jobs.bytedance.com/experienced/position"
  website-path: "society"
  portal-channel: "office"
  portal-platform: "pc"
